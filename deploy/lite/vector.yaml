data_dir: /var/lib/vector

sources:
  webhook_logs:
    type: docker_logs
    include_labels:
      - "kompromise.lite.events=${KOMPROMISE_COMPOSE_PROJECT:-kompromise-lite}"
    auto_partial_merge: true

transforms:
  nats_envelope:
    type: remap
    inputs: [webhook_logs]
    drop_on_error: true
    drop_on_abort: true
    source: |
      if .stream != "stdout" { abort }
      wrapper = parse_json!(string!(.message))
      envelope = object!(wrapper.event)
      assert!(is_array(envelope.Records))
      . = envelope

sinks:
  # Enabled for smoke testing. Remove this block to disable console output.
  console:
    type: console
    inputs: [nats_envelope]
    target: stdout
    encoding:
      codec: json
    buffer:
      type: disk
      # Vector's minimum is 256 MiB + 32 bytes, per sink.
      max_size: 268435488
      # Intentionally lose new events when this sink's buffer is full.
      when_full: drop_newest

  # Optional Elasticsearch/OpenSearch event journal: uncomment to enable.
  # Documents are complete NATS-compatible envelopes, not per-object state.
  # Production destinations normally require authentication and TLS.
  # Prefer a least-privilege, expiring Elasticsearch API key, not an admin password.
  # Set ELASTICSEARCH_API_KEY to the key's encoded value (base64 of id:api_key),
  # without the "ApiKey " prefix. Keep it outside version control and rotate it.
  # Compose passes credentials to Vector and opts into environment interpolation.
  # Native Elasticsearch uses Authorization: ApiKey, NOT x-api-key.
  # OpenSearch authentication differs by deployment; adapt this example accordingly.
  # elasticsearch:
  #   type: elasticsearch
  #   inputs: [nats_envelope]
  #   endpoints: ["${ELASTICSEARCH_ENDPOINT:-https://host.docker.internal:9200}"]
  #   request:
  #     headers:
  #       Authorization: "ApiKey ${ELASTICSEARCH_API_KEY}"
  #   tls:
  #     verify_certificate: true
  #     verify_hostname: true
  #     # For a private CA, mount its PEM into Vector and set ca_file here.
  #     # ca_file: /etc/vector/certs/elasticsearch-ca.pem
  #   mode: bulk
  #   api_version: v8 # Use v7 for OpenSearch / Elasticsearch 7.
  #   bulk:
  #     index: "${ELASTICSEARCH_INDEX:-s3-events}"
  #     action: index
  #   buffer:
  #     type: disk
  #     max_size: 268435488 # 256 MiB + 32 bytes, per sink.
  #     when_full: drop_newest # Intentionally drop new events at capacity.

  # Optional Kafka: uncomment to enable. All advertised brokers must be reachable.
  # Production Kafka (including Kafka 4) normally requires authentication and TLS.
  # SCRAM-SHA-512 over TLS is one common option; match the broker's configuration.
  # Use a dedicated producer identity with topic-scoped ACLs, not an admin account.
  # Set KAFKA_SASL_USERNAME/PASSWORD outside version control and rotate credentials.
  # Kafka has no universal HTTP-style API key. Managed providers may use an API key
  # as the SASL username and its secret as the password, often with PLAIN over TLS;
  # follow your provider's instructions rather than assuming SCRAM support.
  # kafka:
  #   type: kafka
  #   inputs: [nats_envelope]
  #   bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}"
  #   topic: "${KAFKA_TOPIC:-s3-events}"
  #   sasl:
  #     enabled: true
  #     mechanism: SCRAM-SHA-512
  #     username: "${KAFKA_SASL_USERNAME}"
  #     password: "${KAFKA_SASL_PASSWORD}"
  #   tls:
  #     enabled: true
  #     verify_certificate: true
  #     verify_hostname: true
  #     # For a private CA, mount its PEM into Vector and set ca_file here.
  #     # ca_file: /etc/vector/certs/kafka-ca.pem
  #   encoding:
  #     codec: json
  #   buffer:
  #     type: disk
  #     max_size: 268435488 # 256 MiB + 32 bytes, per sink.
  #     when_full: drop_newest # Intentionally drop new events at capacity.

tests:
  - name: forward_only_the_nats_payload
    inputs:
      - insert_at: nats_envelope
        type: log
        log_fields:
          stream: stdout
          container_name: webhook
          message: '{"subject":"s3.events.demo.images.simple","timestamp":"2026-10-05T10:00:01Z","event":{"Records":[{"eventTime":"2026-10-05T10:00:00Z","eventName":"ObjectCreated:Put","custom":"preserved","s3":{"bucket":{"name":"images"},"object":{"key":"a.txt"}}}],"kompromise":{"mode":"simple","pipeline":"simple","source":"sgws","tenant":"demo","bucket":"images","received_at":"2026-10-05T10:00:01Z","enriched_at":"2026-10-05T10:00:01.001Z"}}}'
    outputs:
      - extract_from: nats_envelope
        conditions:
          - type: vrl
            source: |
              assert_eq!(., {"Records": [{"eventTime": "2026-10-05T10:00:00Z", "eventName": "ObjectCreated:Put", "custom": "preserved", "s3": {"bucket": {"name": "images"}, "object": {"key": "a.txt"}}}], "kompromise": {"mode": "simple", "pipeline": "simple", "source": "sgws", "tenant": "demo", "bucket": "images", "received_at": "2026-10-05T10:00:01Z", "enriched_at": "2026-10-05T10:00:01.001Z"}})
  - name: discard_stderr_even_if_it_contains_json
    inputs:
      - insert_at: nats_envelope
        type: log
        log_fields:
          stream: stderr
          message: '{"event":{"Records":[]}}'
    no_outputs_from: [nats_envelope]
  - name: discard_non_event_stdout
    inputs:
      - insert_at: nats_envelope
        type: log
        log_fields:
          stream: stdout
          message: 'not a notification'
    no_outputs_from: [nats_envelope]